name: Web3 E2E Security Audit Matrix

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  web3-e2e-audits:
    name: Core Contract & Frontend Synchronization Audits
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js Infrastructure
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'

    - name: 📦 Install NPM Dependencies
      run: npm ci

    - name: 🎭 Install Playwright Browsers & OS Dependencies
      run: npx playwright install --with-deps chromium

    - name: 🔑 Inject Cryptographic Secrets & Boot Sandbox Environment
      # 🌟 修复点 1：精准匹配你项目里的真实文件名 tests/env-setup.spec.ts
      run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npx playwright test tests/env-setup.spec.ts --headed
      env:
        WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
        MNEMONIC: ${{ secrets.MNEMONIC }}
        WALLET_PASSWORD: ${{ secrets.WALLET_PASSWORD }}
        # 🌟 修复点 2：直接在流水线里注入 DApp 目标地址，消灭 undefined 警告
        BASE_URL: "https://app.uniswap.org/"

    - name: 🚀 Execute High-Velocity Stress & Invariance Audits
      # 跑 tests/ 目录下的所有用例，并用 --grep-invert "@env" 过滤掉开荒脚本
      run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npx playwright test tests/ --grep-invert "@env" --headed
      env:
        WALLET_ADDRESS: ${{ secrets.WALLET_ADDRESS }}
        MNEMONIC: ${{ secrets.MNEMONIC }}
        WALLET_PASSWORD: ${{ secrets.WALLET_PASSWORD }}
        BASE_URL: "https://app.uniswap.org/"

    - name: 📸 Archive Forensic Artifacts (Traces & Screenshots)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-forensic-reports
        path: |
          playwright-report/
          test-results/
          network_dropdown_check.png
        retention-days: 7
